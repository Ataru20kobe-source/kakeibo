<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>家計簿 | Ataru</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&display=swap');
  :root {
    --ink:#1a1510;--paper:#f6f1ea;--cream:#ede5d8;--border:#ccc0ae;
    --red:#c0392b;--green:#1e8449;--blue:#1a5276;--gold:#b07c28;--purple:#7d3c98;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);font-family:'Noto Serif JP',Georgia,serif;color:var(--ink);min-height:100vh}
  input,select{font-family:inherit;font-size:.85rem;border:1.5px solid var(--border);border-radius:6px;padding:8px 10px;background:#fff;color:var(--ink);width:100%;outline:none;transition:border-color .2s}
  input:focus,select:focus{border-color:var(--gold)}
  .tab{background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;font-family:inherit;font-size:.72rem;padding:10px;color:#8a7e72;transition:all .2s;white-space:nowrap}
  .tab.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
  .card{background:#fff;border:1px solid var(--border);border-radius:10px}
  .row{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:1px solid var(--cream);font-size:.76rem;transition:background .15s}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--cream)}
  .del{background:none;border:none;cursor:pointer;color:#ccc;font-size:.8rem;padding:2px 5px;border-radius:3px;flex-shrink:0;transition:color .15s}
  .del:hover{color:var(--red)}
  .pbtn{background:var(--ink);color:var(--paper);border:none;border-radius:6px;padding:10px 22px;font-family:inherit;font-size:.83rem;cursor:pointer;font-weight:500;transition:opacity .2s}
  .pbtn:hover{opacity:.82}
  .pbtn:disabled{opacity:.5;cursor:not-allowed}
  .gbtn{background:#1a73e8;color:#fff;border:none;border-radius:6px;padding:12px 28px;font-family:inherit;font-size:.9rem;cursor:pointer;font-weight:600;transition:opacity .2s;display:flex;align-items:center;gap:10px}
  .gbtn:hover{opacity:.88}
  .aibtn{background:var(--gold);color:#fff;border:none;border-radius:6px;padding:10px 22px;font-family:inherit;font-size:.83rem;cursor:pointer;font-weight:600;transition:opacity .2s}
  .aibtn:hover{opacity:.85}
  .aibtn:disabled{opacity:.5;cursor:not-allowed}
  .lbl{font-size:.68rem;color:#8a7e72;margin-bottom:3px}
  .flash{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 22px;border-radius:20px;font-size:.78rem;z-index:999;pointer-events:none;opacity:0;transition:opacity .3s}
  .flash.show{opacity:1}
  .bar-track{background:var(--cream);border-radius:4px;height:7px;overflow:hidden;margin-top:3px}
  .bar-fill{height:100%;border-radius:4px;transition:width .7s ease}
  .tag-chip{font-size:.63rem;padding:2px 6px;border-radius:8px;white-space:nowrap;font-weight:500}
  .toggle-wrap{display:flex;border:1.5px solid var(--border);border-radius:6px;overflow:hidden}
  .toggle-btn{flex:1;border:none;padding:9px;cursor:pointer;font-family:inherit;font-size:.82rem;background:#fff;color:#8a7e72;transition:all .2s}
  .t-income{background:var(--blue)!important;color:#fff!important;font-weight:600}
  .t-expense{background:var(--red)!important;color:#fff!important;font-weight:600}
  .ocr-drop{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:border-color .2s;background:#fafaf7}
  .ocr-drop:hover{border-color:var(--gold)}
  .warn{background:#fff8e1;border:1px solid #f9a825;border-radius:7px;padding:9px 12px;font-size:.75rem;color:#7a5800}
  .guide-table{width:100%;border-collapse:collapse;font-size:.75rem}
  .guide-table th{background:var(--cream);padding:6px 8px;text-align:left;font-weight:600}
  .guide-table td{padding:6px 8px;border-bottom:1px solid var(--cream)}
  .guide-table tr:last-child td{border-bottom:none}
  .section-title{font-size:.85rem;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--cream)}
  .interest-box{background:#fff8e1;border:1px solid #f0d060;border-radius:8px;padding:12px 14px;font-size:.78rem;line-height:1.8}
  .tag-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
  .tag-btn{border-radius:7px;padding:7px 9px;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s}
  .sync-dot{font-size:.65rem}
  .sync-dot.ok{color:#4caf50}
  .sync-dot.syncing{color:var(--gold)}
  .sync-dot.err{color:var(--red)}

  /* ログイン画面 */
  #loginScreen{display:none;position:fixed;inset:0;background:var(--paper);z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:24px}
  #loginScreen.show{display:flex}
  #mainScreen{display:none}
  #mainScreen.show{display:block}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="loginScreen">
  <div style="text-align:center;margin-bottom:8px">
    <h1 style="font-size:2rem;font-weight:700;letter-spacing:.1em;color:var(--ink)">家計簿</h1>
    <p style="font-size:.75rem;color:#8a7e72;letter-spacing:.12em;margin-top:4px">KAKEIBO</p>
  </div>
  <div class="card" style="padding:28px 24px;max-width:320px;width:90%;text-align:center">
    <p style="font-size:.82rem;color:#6a6060;margin-bottom:20px;line-height:1.7">Googleアカウントでログインして<br>家計を管理しましょう</p>
    <button class="gbtn" id="btnLogin" style="margin:0 auto;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      Googleでログイン
    </button>
  </div>
  <p style="font-size:.65rem;color:#aaa;text-align:center;max-width:280px;line-height:1.6">ログインすることであなただけのデータに安全にアクセスできます</p>
</div>

<!-- メイン画面 -->
<div id="mainScreen">
  <div style="background:var(--ink);padding:14px 16px;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;align-items:baseline;gap:10px">
      <h1 style="color:var(--paper);font-size:1.25rem;font-weight:700;letter-spacing:.08em">家計簿</h1>
      <span style="color:#6a5e50;font-size:.65rem;letter-spacing:.12em">KAKEIBO</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span id="syncStatus" class="sync-dot ok">● 同期済</span>
      <div style="display:flex;align-items:center;gap:6px">
        <img id="userAvatar" style="width:26px;height:26px;border-radius:50%;display:none" />
        <button id="btnLogout" style="background:none;border:1px solid #4a4035;border-radius:5px;padding:4px 9px;font-size:.65rem;color:#a09080;cursor:pointer;font-family:inherit">ログアウト</button>
      </div>
    </div>
  </div>

  <div style="background:var(--cream);border-bottom:1px solid var(--border);padding:7px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <span class="lbl" style="margin-bottom:0;white-space:nowrap">給与月</span>
    <input type="month" id="cycleInput" style="width:148px"/>
    <span id="cycleRange" style="font-size:.68rem;color:#8a7e72;white-space:nowrap"></span>
  </div>

  <div style="background:#fff;border-bottom:1px solid var(--border);display:flex;padding-left:4px;overflow-x:auto">
    <button class="tab on" data-tab="dash">📊 概要</button>
    <button class="tab" data-tab="budget">📅 週次予算</button>
    <button class="tab" data-tab="input">✏️ 入力</button>
    <button class="tab" data-tab="ocr">📷 明細読込</button>
    <button class="tab" data-tab="list">📋 明細</button>
    <button class="tab" data-tab="ai">✦ AI</button>
    <button class="tab" data-tab="guide">📖 ガイド</button>
  </div>

  <div id="app" style="max-width:640px;margin:0 auto;padding:13px 11px"></div>
</div>

<div class="flash" id="flash"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

// ── Firebase ──────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCKxtvcwKML4G4IRhZdH417juZNSXzfzOk",
  authDomain: "mykakeiboonataru.firebaseapp.com",
  projectId: "mykakeiboonataru",
  storageBucket: "mykakeiboonataru.firebasestorage.app",
  messagingSenderId: "992782164759",
  appId: "1:992782164759:web:059498d32cdd2002db8d52"
};
const firebaseApp = initializeApp(firebaseConfig);
const db   = getFirestore(firebaseApp);
const auth = getAuth(firebaseApp);

// ── 定数 ──────────────────────────────────────────────────
const INITIAL_DEBT = 1600000;
const ANNUAL_RATE  = 0.10;
const PAYDAY = 20;

const EXPENSE_TAGS = [
  {id:"debt",   emoji:"💳",label:"借金返済",         color:"#c0392b",bg:"#fdf0f0",desc:"借金の返済額"},
  {id:"fixed",  emoji:"🏠",label:"固定費",           color:"#7d3c98",bg:"#f5eeff",desc:"家賃・光熱費・サブスク"},
  {id:"moving", emoji:"📦",label:"引越し積立",       color:"#1a5276",bg:"#eaf4fb",desc:"9月引越しのための積立"},
  {id:"life",   emoji:"⚔️", label:"空手・小説・人生投資",color:"#1e8449",bg:"#eafaf1",desc:"ライフワーク・娯楽"},
  {id:"daily",  emoji:"🛒",label:"日常運用費",       color:"#ca6f1e",bg:"#fef5ec",desc:"食費・日用品など"},
  {id:"savings",emoji:"💰",label:"積立費",           color:"#9a7d0a",bg:"#fefde7",desc:"月末残り・余剰積立"},
];
const INCOME_TAGS = [
  {id:"salary",  emoji:"💼",label:"給与",      color:"#1a5276",bg:"#eaf4fb",desc:"毎月の給与（手取り）"},
  {id:"side",    emoji:"🌱",label:"副業",      color:"#1e8449",bg:"#eafaf1",desc:"副業・フリーランス"},
  {id:"other_in",emoji:"📥",label:"その他収入",color:"#6d6d6d",bg:"#f4f4f4",desc:"臨時収入など"},
];
const ALL_TAGS = [...INCOME_TAGS,...EXPENSE_TAGS];
const TAG_MAP  = Object.fromEntries(ALL_TAGS.map(t=>[t.id,t]));

const OCR_TYPES = [
  {id:"paypay", label:"PayPay明細",      hint:"チャージ・送金は自動除外"},
  {id:"debit",  label:"デビット明細",    hint:"給与入金・ATM・振替は除外"},
  {id:"credit", label:"クレジット明細",  hint:"固定費・サブスクが中心"},
  {id:"salary", label:"銀行口座（給与入金）", hint:"給与の入金行だけ抽出、手取り額を収入として記録"},
  {id:"receipt",label:"レシート",        hint:"現金払いの領収書"},
];

// ── ユーティリティ ────────────────────────────────────────
const yen = n => "¥"+Number(n||0).toLocaleString("ja-JP");
const todayStr = () => new Date().toISOString().slice(0,10);

function getCycleKey(dateStr) {
  const d = new Date(dateStr+"T00:00:00");
  if (d.getDate()>=PAYDAY) {
    const next = new Date(d.getFullYear(),d.getMonth()+1,1);
    return `${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,"0")}`;
  }
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}

function getCycleRange(key) {
  const [y,m] = key.split("-").map(Number);
  const s = new Date(y,m-2,PAYDAY);
  const e = new Date(y,m-1,PAYDAY-1);
  const fmt = d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  return {start:fmt(s),end:fmt(e)};
}

function getWeeks(key) {
  const {start,end} = getCycleRange(key);
  const weeks=[], fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  let s = new Date(start+"T00:00:00");
  for(let i=0;i<5;i++){
    const e2=new Date(s); e2.setDate(e2.getDate()+6);
    weeks.push({label:`第${i+1}週`,start:fmt(s),end:fmt(e2)});
    s.setDate(s.getDate()+7);
    if(fmt(s)>end) break;
  }
  return weeks;
}

function calcInterest(principal, payment) {
  const monthlyRate = ANNUAL_RATE/12;
  const interestPart   = Math.round(principal*monthlyRate);
  const principalPart  = Math.max(0, payment-interestPart);
  return {interestPart, principalPart};
}

// ── 状態 ──────────────────────────────────────────────────
let currentUser = null;
let records=[], debtPaid=0, budgets={};
let cycleKey = getCycleKey(todayStr());
let currentTab = "dash";
let form = {date:todayStr(),tag:"daily",amount:"",memo:"",isIncome:false};
let ocrType="paypay", ocrImg=null, ocrCands=[];
let aiResult="";
let unsubs=[];

// ── 認証 ──────────────────────────────────────────────────
document.getElementById("btnLogin").onclick = async () => {
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch(e) { showFlash("ログインに失敗しました"); }
};

document.getElementById("btnLogout").onclick = async () => {
  unsubs.forEach(u=>u());
  unsubs=[];
  records=[]; debtPaid=0; budgets={};
  await signOut(auth);
};

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (user) {
    document.getElementById("loginScreen").classList.remove("show");
    document.getElementById("mainScreen").classList.add("show");
    const av = document.getElementById("userAvatar");
    if(user.photoURL){ av.src=user.photoURL; av.style.display="block"; }
    startSync(user.uid);
    initCycleInput();
    render();
  } else {
    document.getElementById("mainScreen").classList.remove("show");
    document.getElementById("loginScreen").classList.add("show");
  }
});

// ── Firebaseリアルタイム同期 ──────────────────────────────
function setSyncStatus(s) {
  const el = document.getElementById("syncStatus");
  if(!el) return;
  el.className = "sync-dot "+(s==="ok"?"ok":s==="syncing"?"syncing":"err");
  el.textContent = s==="ok"?"● 同期済":s==="syncing"?"● 同期中...":"● オフライン";
}

function startSync(uid) {
  unsubs.forEach(u=>u()); unsubs=[];

  const u1 = onSnapshot(collection(db,`users/${uid}/records`), snap=>{
    records = snap.docs.map(d=>({id:d.id,...d.data()}));
    setSyncStatus("ok"); render();
  }, ()=>setSyncStatus("err"));

  const u2 = onSnapshot(doc(db,`users/${uid}/meta/data`), snap=>{
    if(snap.exists()){
      const d=snap.data();
      debtPaid = d.debtPaid||0;
      budgets  = d.budgets||{};
    }
    render();
  });

  unsubs=[u1,u2];
}

async function saveMeta() {
  if(!currentUser) return;
  setSyncStatus("syncing");
  await setDoc(doc(db,`users/${currentUser.uid}/meta/data`),{debtPaid,budgets});
  setSyncStatus("ok");
}

async function addRecord(rec) {
  if(!currentUser) return;
  setSyncStatus("syncing");
  const id = Date.now()+"-"+Math.random().toString(36).slice(2);
  await setDoc(doc(db,`users/${currentUser.uid}/records`,id),{...rec,id});
  if(rec.tag==="debt"){ debtPaid+=rec.amount; await saveMeta(); }
  setSyncStatus("ok");
}

async function deleteRecord(rec) {
  if(!currentUser) return;
  setSyncStatus("syncing");
  await deleteDoc(doc(db,`users/${currentUser.uid}/records`,rec.id));
  if(rec.tag==="debt"){ debtPaid=Math.max(0,debtPaid-rec.amount); await saveMeta(); }
  setSyncStatus("ok");
}

// ── フラッシュ ────────────────────────────────────────────
let flashTimer;
function showFlash(msg) {
  const el=document.getElementById("flash");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>el.classList.remove("show"),2200);
}

// ── サイクル ──────────────────────────────────────────────
function initCycleInput() {
  const inp=document.getElementById("cycleInput");
  if(!inp) return;
  inp.value=cycleKey;
  inp.onchange=e=>{ cycleKey=e.target.value; updateCycleRange(); render(); };
  updateCycleRange();
}

function updateCycleRange() {
  const el=document.getElementById("cycleRange"); if(!el) return;
  const {start,end}=getCycleRange(cycleKey);
  el.textContent=`${start} 〜 ${end}`;
}

// ── タブ ──────────────────────────────────────────────────
document.querySelectorAll(".tab").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    currentTab=btn.dataset.tab;
    render();
  };
});

// ── メインレンダー ────────────────────────────────────────
function render() {
  if(!currentUser) return;
  const app=document.getElementById("app"); if(!app) return;
  const {start,end}=getCycleRange(cycleKey);
  const weeks=getWeeks(cycleKey);
  const cycleRecs=records.filter(r=>r.date>=start&&r.date<=end).sort((a,b)=>b.date.localeCompare(a.date));
  const cycleIncome =cycleRecs.filter(r=>r.isIncome).reduce((s,r)=>s+r.amount,0);
  const cycleExpense=cycleRecs.filter(r=>!r.isIncome).reduce((s,r)=>s+r.amount,0);
  const cycleBalance=cycleIncome-cycleExpense;
  const debtRemaining=INITIAL_DEBT-debtPaid;
  const debtPct=Math.min(100,(debtPaid/INITIAL_DEBT)*100);
  const byTag=Object.fromEntries(ALL_TAGS.map(t=>[t.id,cycleRecs.filter(r=>r.tag===t.id).reduce((s,r)=>s+r.amount,0)]));
  const weekActuals=weeks.map(w=>cycleRecs.filter(r=>!r.isIncome&&r.date>=w.start&&r.date<=w.end).reduce((s,r)=>s+r.amount,0));
  const cycleBudget=budgets[cycleKey]||{};
  const totalBudget=weeks.reduce((s,_,i)=>s+(cycleBudget[`w${i}`]||0),0);
  const budgetOverIncome=cycleIncome>0&&totalBudget>cycleIncome;
  const monthDebtPayment=byTag["debt"]||0;
  const monthlyRate=ANNUAL_RATE/12;
  const {interestPart,principalPart}=calcInterest(debtRemaining+(monthDebtPayment>0?monthDebtPayment:0),monthDebtPayment);
  const allDebtRecs=records.filter(r=>r.tag==="debt");
  const avgPay=allDebtRecs.length>0?allDebtRecs.reduce((s,r)=>s+r.amount,0)/Math.max(1,new Set(allDebtRecs.map(r=>r.date.slice(0,7))).size):0;
  let completionMonths=null;
  if(avgPay>debtRemaining*monthlyRate&&avgPay>0)
    completionMonths=Math.ceil(Math.log(1-(debtRemaining*monthlyRate)/avgPay)/Math.log(1+monthlyRate)*-1);

  // ── DASH ──
  if(currentTab==="dash"){
    app.innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:11px">
        ${[{l:"収入",v:cycleIncome,c:"var(--blue)"},{l:"支出",v:cycleExpense,c:"var(--red)"},{l:"収支",v:cycleBalance,c:cycleBalance>=0?"var(--green)":"var(--red)"}].map(({l,v,c})=>`
          <div class="card" style="padding:11px 8px;text-align:center">
            <div class="lbl" style="text-align:center">${l}</div>
            <div style="font-size:.92rem;font-weight:700;color:${c}">${yen(v)}</div>
          </div>`).join("")}
      </div>
      <div class="card" style="padding:16px;margin-bottom:11px;border-left:4px solid var(--red)">
        <div class="lbl">💳 借金残高</div>
        <div style="font-size:1.7rem;font-weight:700;color:var(--red);margin-bottom:2px">${yen(debtRemaining)}</div>
        <div style="font-size:.66rem;color:#9a8e82;margin-bottom:10px">返済済 ${yen(debtPaid)} / 初期 ${yen(INITIAL_DEBT)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${debtPct}%;background:var(--red)"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:.64rem;color:#9a8e82;margin-top:3px">
          <span>返済率 ${debtPct.toFixed(1)}%</span>
          <span>${completionMonths?`あと約${completionMonths}ヶ月で完済予測`:"返済記録を追加すると完済予測が出ます"}</span>
        </div>
        ${monthDebtPayment>0?`
        <div class="interest-box" style="margin-top:12px">
          <div style="font-weight:600;margin-bottom:6px">今月の返済内訳（年利10%）</div>

// ── OCR処理 ──────────────────────────────────────────────
async function handleOCR(e) {
  const file=e.target.files?.[0]; if(!file) return;
  ocrCands=[]; document.getElementById("ocrErr").textContent="";
  const reader=new FileReader();
  reader.onload=async ev=>{
    const b64=ev.target.result.split(",")[1];
    ocrImg=ev.target.result;
    document.getElementById("ocrLoading").style.display="block";
    const typeInfo=OCR_TYPES.find(t=>t.id===ocrType);

    // 給与入金専用のプロンプト
    const isSalary = ocrType==="salary";
    const systemPrompt = isSalary
      ? `あなたは家計簿AIです。銀行口座の明細画像から「給与」「給与振込」「賞与」などの収入入金だけを抽出しJSON配列のみを返してください。ATM・振替・引き落とし・チャージは除外。フォーマット:[{"date":"YYYY-MM-DD","amount":数値,"memo":"給与 [会社名など]","suggestedTag":"salary","isIncome":true}] 日付不明は${todayStr()}。金額は円の整数。`
      : `あなたは家計簿AIです。${typeInfo.label}の画像から実際の「支払い取引」だけを抽出しJSON配列のみを返してください。説明文・コードブロック不要。除外:PayPayはチャージ・送金・受取、デビットは給与入金・ATM・振替、クレカは繰越・ポイント・合計行。フォーマット:[{"date":"YYYY-MM-DD","amount":数値,"memo":"内容","suggestedTag":"debt|fixed|moving|life|daily|savings|salary|side|other_in","isIncome":false}] 日付不明は${todayStr()}。金額は円の整数。`;

    try {
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:1000,system:systemPrompt,
        messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:file.type||"image/jpeg",data:b64}},{type:"text",text:`この${typeInfo.label}から取引を全て抽出してJSON配列で返してください。`}]}]
      })});
      const data=await res.json();
      const raw=data.content?.map(b=>b.text||"").join("")||"";
      ocrCands=JSON.parse(raw.replace(/```json|```/g,"").trim()).map((c,i)=>({...c,_key:i,_sel:true}));
    } catch { document.getElementById("ocrErr").textContent="読み取り失敗。別の画像を試してください。"; }
    document.getElementById("ocrLoading").style.display="none";
    render();
  };
  reader.readAsDataURL(file);
}
