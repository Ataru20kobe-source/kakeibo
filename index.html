async function callClaude(system, userContent, maxTokens=1000) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model:"claude-sonnet-4-5", max_tokens:maxTokens, system, messages:[{role:"user",content:userContent}] })

}

function getCycleKey(dateStr) {
  const d = new Date(dateStr+"T00:00:00");
  if (d.getDate()>=PAYDAY) {
    const next = new Date(d.getFullYear(),d.getMonth()+1,1);
    return `${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,"0")}`;
  }
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
function getCycleRange(key) {
  const [y,m]=key.split("-").map(Number);
  const s=new Date(y,m-2,PAYDAY), e=new Date(y,m-1,PAYDAY-1);
  const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  return {start:fmt(s),end:fmt(e)};
}
function getWeeks(key) {
  const {start,end}=getCycleRange(key);
  const weeks=[],fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  let s=new Date(start+"T00:00:00");
  for(let i=0;i<5;i++){
    const e2=new Date(s); e2.setDate(e2.getDate()+6);
    weeks.push({label:`第${i+1}週`,start:fmt(s),end:fmt(e2)});
    s.setDate(s.getDate()+7);
    if(fmt(s)>end) break;
  }
  return weeks;
}

// 利息計算：元本残高×月利=利息、返済額-利息=元本返済分
function calcInterest(currentPrincipal, paymentAmount, annualRate) {
  const monthlyRate = annualRate/12;
  const interestPart  = Math.round(currentPrincipal*monthlyRate);
  const principalPart = Math.max(0, paymentAmount-interestPart);
  return {interestPart, principalPart};
}

// SMBC借金残高を動的に計算（debts[0].balanceを初期値として使用）
function getSMBCRemaining() {
  const smbcDebt = debts.find(d=>d.id==="smbc");
  const initialBalance = smbcDebt ? smbcDebt.balance : 1483926;
  return Math.max(0, initialBalance - debtPrincipalPaid);
}

// 総資産・総負債の計算
function calcNetWorth() {
  const totalAssets = accounts.reduce((s,a)=>s+a.balance, 0);
  const smbcRemaining = getSMBCRemaining();
  const rakutenDebt = debts.find(d=>d.id==="rakuten");
  const rakutenRemaining = rakutenDebt ? rakutenDebt.balance : 49808;
  const totalDebt = smbcRemaining + rakutenRemaining;
  return {totalAssets, totalDebt, netWorth: totalAssets - totalDebt, smbcRemaining, rakutenRemaining};
}

function setSyncStatus(s){
  const el=document.getElementById("syncStatus"); if(!el) return;
  el.className="sync-dot "+(s==="ok"?"ok":s==="syncing"?"syncing":"err");
  el.textContent=s==="ok"?"● 同期済":s==="syncing"?"● 同期中...":"● オフライン";
}
function startSync(uid){
  unsubs.forEach(u=>u()); unsubs=[];
  const u1=onSnapshot(collection(db,`users/${uid}/records`),snap=>{
    records=snap.docs.map(d=>({id:d.id,...d.data()}));
    setSyncStatus("ok"); render();
  },()=>setSyncStatus("err"));
  const u2=onSnapshot(doc(db,`users/${uid}/meta/data`),snap=>{
    if(snap.exists()){
      const d=snap.data();
      debtPrincipalPaid=d.debtPrincipalPaid??d.debtPaid??0;
      budgets=d.budgets||{};
      if(d.debts) debts=d.debts;
      if(d.accounts) accounts=d.accounts;
    }
    render();
  });
  unsubs=[u1,u2];
}
async function saveMeta(){
  if(!currentUser) return;
  setSyncStatus("syncing");
  await setDoc(doc(db,`users/${currentUser.uid}/meta/data`),{debtPrincipalPaid,budgets,debts,accounts});
  setSyncStatus("ok");
}
async function addRecord(rec){
  if(!currentUser) return;
  setSyncStatus("syncing");
  const id=Date.now()+"-"+Math.random().toString(36).slice(2);
  let enriched={...rec,id};
  const smbcDebt = debts.find(d=>d.id==="smbc");
  const smbcRate = smbcDebt ? smbcDebt.rate : 0.12;
  if(rec.tag==="debt"){
    const currentPrincipal=getSMBCRemaining();
    const {interestPart,principalPart}=calcInterest(currentPrincipal,rec.amount,smbcRate);
    enriched.interestPart=interestPart;
    enriched.principalPart=principalPart;
    await setDoc(doc(db,`users/${currentUser.uid}/records`,id),enriched);
    debtPrincipalPaid+=principalPart;
    await saveMeta();
  } else if(rec.tag==="prepay"){
    // 繰上返済：全額元本返済として処理
    enriched.interestPart=0;
    enriched.principalPart=rec.amount;
    await setDoc(doc(db,`users/${currentUser.uid}/records`,id),enriched);
    debtPrincipalPaid+=rec.amount;
    await saveMeta();
  } else if(rec.tag==="rakuten_pay"){
    // 楽天分割：debtsのrakuten残高を減らす
    const rakIdx=debts.findIndex(d=>d.id==="rakuten");
    if(rakIdx>=0){
      debts[rakIdx].balance=Math.max(0,debts[rakIdx].balance-rec.amount);
    }
    await setDoc(doc(db,`users/${currentUser.uid}/records`,id),enriched);
    await saveMeta();
  } else {
    await setDoc(doc(db,`users/${currentUser.uid}/records`,id),enriched);
  }
  setSyncStatus("ok");
}
async function deleteRecord(rec){
  if(!currentUser) return;
  setSyncStatus("syncing");
  await deleteDoc(doc(db,`users/${currentUser.uid}/records`,rec.id));
  if(rec.tag==="debt"||rec.tag==="prepay"){
    const principal=rec.principalPart??rec.amount;
    debtPrincipalPaid=Math.max(0,debtPrincipalPaid-principal);
    await saveMeta();
  } else if(rec.tag==="rakuten_pay"){
    const rakIdx=debts.findIndex(d=>d.id==="rakuten");
    if(rakIdx>=0) debts[rakIdx].balance+=rec.amount;
    await saveMeta();
  }
  setSyncStatus("ok");
}

function initOCR(){
  const grid=document.getElementById("ocrTypeGrid");
  grid.innerHTML="";
  OCR_TYPES.forEach(t=>{
    const btn=document.createElement("button");
    btn.className="ocr-type-card"+(t.id===ocrType?" selected":"");
    btn.dataset.ocrId=t.id;
    btn.innerHTML=`<div class="title">${t.label}</div><div class="hint">${t.hint}</div>`;
    btn.onclick=()=>{
      ocrType=t.id;
      document.querySelectorAll(".ocr-type-card").forEach(c=>c.classList.remove("selected"));
      btn.classList.add("selected");
    };
    grid.appendChild(btn);
  });

  document.getElementById("ocrUploadArea").onclick=()=>document.getElementById("ocrFileInput").click();

  document.getElementById("ocrFileInput").onchange=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      const dataUrl=ev.target.result;
      document.getElementById("ocrPlaceholder").style.display="none";
      const preview=document.getElementById("ocrPreview");
      preview.src=dataUrl; preview.style.display="block";
      document.getElementById("ocrLoadingMsg").style.display="block";
      document.getElementById("ocrErrorMsg").textContent="";
      document.getElementById("ocrResultPanel").style.display="none";

      const b64=dataUrl.split(",")[1];
      const mediaType=file.type||"image/jpeg";
      const isSalary=ocrType==="salary";
      const typeInfo=OCR_TYPES.find(t=>t.id===ocrType);

      const system=isSalary
        ?`あなたは家計簿AIです。銀行口座の明細画像から「給与」「給与振込」「賞与」などの収入入金だけを抽出しJSON配列のみを返してください。ATM・振替・引き落とし・チャージは除外。フォーマット:[{"date":"YYYY-MM-DD","amount":数値,"memo":"給与","suggestedTag":"salary","isIncome":true}] 日付不明は${todayStr()}。金額は円の整数。`
        :`あなたは家計簿AIです。${typeInfo.label}の画像から実際の支払い取引だけを抽出しJSON配列のみを返してください。説明文やコードブロック記号は不要。
除外ルール:
- PayPay: チャージ・送金・受取は除外
- デビット: 給与入金・ATM引き出し・口座振替・Suicaチャージは除外
- クレジット: 繰越残高・ポイント・支払い合計行・Suicaチャージは除外
- Suica: チャージ行は除外（乗車・ショッピングのみ抽出）
フォーマット:[{"date":"YYYY-MM-DD","amount":数値,"memo":"内容","suggestedTag":"${EXPENSE_TAG_IDS}","isIncome":false}]
タグ選択の目安:
- 外食・定食屋→food
- コンビニ飲食→food_cvs
- スーパー・ドラッグストア→daily_goods
- 衣服・美容院→fashion
- 書籍・学習→education
- 病院・薬→medical
- 飲み会・贈り物→social
- Netflix・Spotify等→subscription
- 家賃・光熱費→fixed
- 借金返済→debt
- Suica乗車・電車→other_exp
- その他→other_exp
日付不明は${todayStr()}。金額は円の整数。`;

      const userContent=[
        {type:"image",source:{type:"base64",media_type:mediaType,data:b64}},
        {type:"text",text:`この${typeInfo.label}から取引を全て抽出してJSON配列で返してください。`}
      ];

      try{
        const text=await callClaude(system,userContent);
        const clean=text.replace(/```json|```/g,"").trim();
        ocrCands=JSON.parse(clean).map((c,i)=>({...c,_key:i,_sel:true}));
        renderOCRResults();
      } catch(err){
        document.getElementById("ocrErrorMsg").textContent="読み取りに失敗しました: "+err.message;
      }
      document.getElementById("ocrLoadingMsg").style.display="none";
    };
    reader.readAsDataURL(file);
  };

  document.getElementById("ocrCancelBtn").onclick=()=>{
    ocrCands=[];
    document.getElementById("ocrResultPanel").style.display="none";
    document.getElementById("ocrPreview").style.display="none";
    document.getElementById("ocrPlaceholder").style.display="block";
    document.getElementById("ocrFileInput").value="";
  };

  document.getElementById("ocrCommitBtn").onclick=async()=>{
    const toAdd=ocrCands.filter(c=>c._sel);
    if(toAdd.length===0){showFlash("追加する項目を選択してください");return;}
    document.getElementById("ocrCommitBtn").disabled=true;
    for(const c of toAdd){
      await addRecord({date:c.date,tag:c.suggestedTag||"other_exp",amount:c.amount,memo:c.memo,isIncome:c.isIncome||false});
    }
    showFlash(`${toAdd.length}件追加しました！`);
    ocrCands=[];
    document.getElementById("ocrResultPanel").style.display="none";
    document.getElementById("ocrPreview").style.display="none";
    document.getElementById("ocrPlaceholder").style.display="block";
    document.getElementById("ocrFileInput").value="";
    document.getElementById("ocrCommitBtn").disabled=false;
  };
}

function renderOCRResults(){
  const list=document.getElementById("ocrCandList");
  list.innerHTML="";
  ocrCands.forEach((c,i)=>{
    const t=TAG_MAP[c.suggestedTag]||TAG_MAP["other_exp"];
    const item=document.createElement("div");
    item.className="cand-item";
    item.innerHTML=`
      <input type="checkbox" class="cand-check" ${c._sel?"checked":""} data-i="${i}"/>
      <span style="color:#9a8e82;min-width:78px;flex-shrink:0;font-size:.7rem">${c.date}</span>
      <span class="tag-chip" style="background:${t.bg};color:${t.color};flex-shrink:0">${t.emoji} ${t.label}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#7a6e62">${c.memo}</span>
      <span style="font-weight:600;color:${c.isIncome?"var(--blue)":"var(--red)"};flex-shrink:0">${c.isIncome?"+":"−"}${yen(c.amount)}</span>
      <select data-i="${i}" style="width:110px;flex-shrink:0;font-size:.65rem;padding:3px 4px;font-family:inherit;border:1px solid var(--border);border-radius:4px">
        ${ALL_TAGS.map(tt=>`<option value="${tt.id}"${c.suggestedTag===tt.id?" selected":""}>${tt.emoji} ${tt.label}</option>`).join("")}
      </select>`;
    item.querySelector(".cand-check").onchange=ev=>{
      ocrCands[i]._sel=ev.target.checked;
      document.getElementById("ocrCommitBtn").textContent=`追加する（${ocrCands.filter(c=>c._sel).length}件）`;
    };
    item.querySelector("select").onchange=ev=>{ocrCands[i].suggestedTag=ev.target.value;renderOCRResults();};
    list.appendChild(item);
  });
  document.getElementById("ocrCommitBtn").textContent=`追加する（${ocrCands.filter(c=>c._sel).length}件）`;
  document.getElementById("ocrResultPanel").style.display="block";
}

function render(){
  if(!currentUser) return;
  const app=document.getElementById("app"); if(!app) return;
  if(currentTab==="ocr") return;

  const {start,end}=getCycleRange(cycleKey);
  const weeks=getWeeks(cycleKey);
  const cycleRecs=records.filter(r=>r.date>=start&&r.date<=end).sort((a,b)=>b.date.localeCompare(a.date));
  const cycleIncome=cycleRecs.filter(r=>r.isIncome).reduce((s,r)=>s+r.amount,0);
  const cycleExpense=cycleRecs.filter(r=>!r.isIncome).reduce((s,r)=>s+r.amount,0);
  const cycleBalance=cycleIncome-cycleExpense;
  const debtRemaining=getSMBCRemaining();
  const smbcDebt=debts.find(d=>d.id==="smbc")||DEFAULT_DEBTS[0];
  const initialSMBC=smbcDebt.balance;
  const debtPct=Math.min(100,(debtPrincipalPaid/initialSMBC)*100);
  const byTag=Object.fromEntries(ALL_TAGS.map(t=>[t.id,cycleRecs.filter(r=>r.tag===t.id).reduce((s,r)=>s+r.amount,0)]));
  const weekActuals=weeks.map(w=>cycleRecs.filter(r=>!r.isIncome&&r.date>=w.start&&r.date<=w.end).reduce((s,r)=>s+r.amount,0));
  const cycleBudget=budgets[cycleKey]||{};
  const totalBudget=weeks.reduce((s,_,i)=>s+(cycleBudget[`w${i}`]||0),0);
  const budgetOverIncome=cycleIncome>0&&totalBudget>cycleIncome;
  const monthlyRate=smbcDebt.rate/12;
  const debtRecs=cycleRecs.filter(r=>r.tag==="debt"||r.tag==="prepay");
  const monthDebtPayment=debtRecs.reduce((s,r)=>s+r.amount,0);
  const monthInterestTotal=debtRecs.reduce((s,r)=>s+(r.interestPart||0),0);
  const monthPrincipalTotal=debtRecs.reduce((s,r)=>s+(r.principalPart??r.amount),0);
  const allDebtRecs=records.filter(r=>r.tag==="debt"||r.tag==="prepay");
  const avgPrincipalPay=allDebtRecs.length>0?allDebtRecs.reduce((s,r)=>s+(r.principalPart??r.amount),0)/Math.max(1,new Set(allDebtRecs.map(r=>r.date.slice(0,7))).size):0;
  let completionMonths=null;
  if(avgPrincipalPay>debtRemaining*monthlyRate&&avgPrincipalPay>0)
    completionMonths=Math.ceil(Math.log(1-(debtRemaining*monthlyRate)/avgPrincipalPay)/Math.log(1+monthlyRate)*-1);

  if(currentTab==="dash"){
    app.innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:11px">
        ${[{l:"収入",v:cycleIncome,c:"var(--blue)"},{l:"支出",v:cycleExpense,c:"var(--red)"},{l:"収支",v:cycleBalance,c:cycleBalance>=0?"var(--green)":"var(--red)"}].map(({l,v,c})=>`
          <div class="card" style="padding:11px 8px;text-align:center">
            <div class="lbl" style="text-align:center">${l}</div>
            <div style="font-size:.92rem;font-weight:700;color:${c}">${yen(v)}</div>
          </div>`).join("")}
      </div>
      <div class="card" style="padding:16px;margin-bottom:11px;border-left:4px solid var(--red)">
        <div class="lbl">💳 SMBC借金残高（元本）</div>
        <div style="font-size:1.7rem;font-weight:700;color:var(--red);margin-bottom:2px">${yen(debtRemaining)}</div>
        <div style="font-size:.66rem;color:#9a8e82;margin-bottom:10px">元本返済済 ${yen(debtPrincipalPaid)} / 初期元本 ${yen(initialSMBC)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${debtPct}%;background:var(--red)"></div></div>
        <div style="display:flex;justify-content:space-between;font-size:.64rem;color:#9a8e82;margin-top:3px">
          <span>元本返済率 ${debtPct.toFixed(1)}%</span>
          <span>${completionMonths?`あと約${completionMonths}ヶ月で完済予測`:"返済記録を追加すると完済予測が出ます"}</span>
        </div>
        ${monthDebtPayment>0?`
        <div class="interest-box" style="margin-top:12px">
          <div style="font-weight:600;margin-bottom:6px">今月の返済内訳（年利${(smbcDebt.rate*100).toFixed(0)}%）</div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center">
            <div><div class="lbl" style="text-align:center">返済合計</div><div style="font-weight:700">${yen(monthDebtPayment)}</div></div>
            <div><div class="lbl" style="text-align:center">うち利息</div><div style="font-weight:700;color:var(--red)">${yen(monthInterestTotal)}</div></div>
            <div><div class="lbl" style="text-align:center">元本減少</div><div style="font-weight:700;color:var(--green)">${yen(monthPrincipalTotal)}</div></div>
          </div>
          <div style="font-size:.68rem;color:#7a6050;margin-top:6px">月利 ${(monthlyRate*100).toFixed(3)}% / 今月利息発生額 ${yen(Math.round(debtRemaining*monthlyRate))}</div>
        </div>`:`<div style="font-size:.7rem;color:#aaa;margin-top:8px">今月の返済を記録すると利息内訳が表示されます</div>`}

              <span>${t.emoji} ${t.label}</span>

          <div style="margin-bottom:8px">

            </div>

  }

    app.innerHTML=`

                <div style="font-size:.7rem;color:${over?"var(--red)":"var(--green)"};font-weight:600">${over?"⚠️ 超過":"✓ 範囲内"}</div>
                <div style="font-size:.75rem">実績 <strong style="color:${over?"var(--red)":"var(--ink)"}">${yen(actual)}</strong></div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:5px">
              <span style="font-size:.7rem;color:#8a7e72;white-space:nowrap">予算</span>
              <input type="number" placeholder="例:30000" value="${budget||""}" data-week="${i}" class="budget-input" min="0"/>
              <span style="font-size:.7rem;color:#8a7e72;white-space:nowrap">円</span>
            </div>
            ${budget>0?`<div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${over?"var(--red)":"var(--green)"}"></div></div>`:""}
          </div>`;
        }).join("")}
        <div style="border-top:1px solid var(--cream);padding-top:10px;display:flex;justify-content:space-between;font-size:.8rem;font-weight:600">
          <span>予算合計</span>
          <span style="color:${budgetOverIncome?"var(--red)":"var(--ink)"}">${yen(totalBudget)}${cycleIncome>0?` / 収入 ${yen(cycleIncome)}`:""}</span>
        </div>
      </div>`;
    setTimeout(()=>{
      document.querySelectorAll(".budget-input").forEach(inp=>inp.onchange=async e=>{
        const wi=e.target.dataset.week;
        budgets={...budgets,[cycleKey]:{...(budgets[cycleKey]||{}),[`w${wi}`]:parseInt(e.target.value)||0}};
        await saveMeta(); render();
      });
    },0);
  }

  else if(currentTab==="input"){
    const tags=form.isIncome?INCOME_TAGS:EXPENSE_TAGS;
    app.innerHTML=`
      <div class="card" style="padding:17px">
        <div class="section-title">新規記録</div>
        <div style="display:flex;flex-direction:column;gap:11px">
          <div>
            <div class="lbl">種別</div>
            <div class="toggle-wrap">
              <button class="toggle-btn${!form.isIncome?" t-expense":""}" id="btnExpense">支出</button>
              <button class="toggle-btn${form.isIncome?" t-income":""}" id="btnIncome">収入</button>
            </div>
          </div>
          <div>
            <div class="lbl">タグ</div>
            ${!form.isIncome?`<div class="tag-group-title">固定支出</div>`:""}
            <div class="tag-grid">
              ${(form.isIncome?INCOME_TAGS:FIXED_TAGS).map(t=>`
                <button class="tag-btn" data-tag="${t.id}" style="border:2px solid ${form.tag===t.id?t.color:"var(--border)"};background:${form.tag===t.id?t.bg:"#fff"}">
                  <div style="font-size:.76rem;font-weight:${form.tag===t.id?600:400};color:${form.tag===t.id?t.color:"var(--ink)"}">${t.emoji} ${t.label}</div>
                  <div style="font-size:.6rem;color:#9a8e82;margin-top:1px">${t.desc}</div>
                </button>`).join("")}
            </div>
            ${!form.isIncome?`
            <div class="tag-group-title">日常支出</div>
            <div class="tag-grid">
              ${DAILY_TAGS.map(t=>`
                <button class="tag-btn" data-tag="${t.id}" style="border:2px solid ${form.tag===t.id?t.color:"var(--border)"};background:${form.tag===t.id?t.bg:"#fff"}">
                  <div style="font-size:.76rem;font-weight:${form.tag===t.id?600:400};color:${form.tag===t.id?t.color:"var(--ink)"}">${t.emoji} ${t.label}</div>
                  <div style="font-size:.6rem;color:#9a8e82;margin-top:1px">${t.desc}</div>
                </button>`).join("")}
            </div>`:""}
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
            <div><div class="lbl">日付</div><input type="date" id="fDate" value="${form.date}"/></div>
            <div><div class="lbl">金額（円）</div><input type="number" id="fAmt" placeholder="例:800" value="${form.amount}" min="1"/></div>
          </div>
          <div><div class="lbl">メモ（任意）</div><input type="text" id="fMemo" placeholder="例:ラーメン屋、食堂など" value="${form.memo}"/></div>
          ${(form.tag==="debt"||form.tag==="prepay")?`<div style="background:#fdf0f0;border:1px solid #f1948a;border-radius:7px;padding:8px 11px;font-size:.73rem;color:var(--red)">💳 SMBC現在残高: <strong>${yen(debtRemaining)}</strong>　月利 ${(monthlyRate*100).toFixed(3)}%<br>${form.tag==="prepay"?"繰上返済：全額が元本返済として処理されます":"返済額から利息を引いた分だけ元本が減ります"}</div>`:""}
          <div style="text-align:right"><button class="pbtn" id="btnAdd">追加する</button></div>
        </div>
      </div>`;
    setTimeout(()=>{
      document.getElementById("btnExpense").onclick=()=>{form.isIncome=false;form.tag="food";render();};
      document.getElementById("btnIncome").onclick =()=>{form.isIncome=true; form.tag="salary";render();};
      document.querySelectorAll(".tag-btn").forEach(b=>b.onclick=()=>{form.tag=b.dataset.tag;render();});
      document.getElementById("fDate").oninput =e=>form.date=e.target.value;
      document.getElementById("fAmt").oninput  =e=>form.amount=e.target.value;
      document.getElementById("fMemo").oninput =e=>form.memo=e.target.value;
      document.getElementById("btnAdd").onclick=async()=>{
        const amt=parseInt(form.amount);
        if(!form.date||!amt||amt<=0){showFlash("日付と金額を入力してください");return;}
        document.getElementById("btnAdd").disabled=true;
        await addRecord({date:form.date,tag:form.tag,amount:amt,memo:form.memo,isIncome:form.isIncome});
        form.amount=""; form.memo="";
        showFlash("追加しました！");
        render();
      };
    },0);
  }

  else if(currentTab==="list"){
    app.innerHTML=`
      <div class="card" style="overflow:hidden">
        <div style="padding:9px 11px;border-bottom:1px solid var(--cream);font-size:.7rem;color:#8a7e72">
          ${cycleKey} — ${cycleRecs.length}件 / 収入 ${yen(cycleIncome)} 支出 ${yen(cycleExpense)}
        </div>
        ${cycleRecs.length===0
          ?`<div style="padding:34px;text-align:center;color:#bbb;font-size:.82rem">この月の記録はありません</div>`
          :cycleRecs.map(r=>{
            const t=TAG_MAP[r.tag]||{emoji:"?",label:r.tag,color:"#888",bg:"#eee"};
            return `<div class="row">
              <span style="color:#9a8e82;min-width:72px;flex-shrink:0;font-size:.68rem">${r.date}</span>
              <span class="tag-chip" style="background:${t.bg};color:${t.color};flex-shrink:0">${t.emoji} ${t.label}</span>
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#7a6e62">${r.memo||"—"}</span>
              <span style="font-weight:600;color:${r.isIncome?"var(--blue)":"var(--red)"};min-width:68px;text-align:right;flex-shrink:0">${r.isIncome?"+":"−"}${yen(r.amount)}</span>
              <button class="del" data-id="${r.id}">✕</button>
            </div>`;
          }).join("")}
      </div>`;
    setTimeout(()=>{
      document.querySelectorAll(".del").forEach(btn=>btn.onclick=async()=>{
        const rec=cycleRecs.find(r=>r.id===btn.dataset.id);
        if(rec){await deleteRecord(rec);showFlash("削除しました");}
      });
    },0);
  }

  else if(currentTab==="ai"){
    app.innerHTML=`
      <div class="card" style="padding:17px;display:flex;flex-direction:column;gap:12px">
        <div>
          <div class="section-title" style="margin-bottom:3px">✦ AI家計アドバイス</div>
          <p style="font-size:.7rem;color:#9a8e82">週次予算・借金返済ペース・利息負担も含めて分析します</p>
        </div>
        <button class="aibtn" id="btnAI">✦ AI分析を実行する</button>
        ${aiResult?`<div style="background:#fafaf7;border:1px solid var(--border);border-radius:8px;padding:13px;font-size:.8rem;line-height:1.9;white-space:pre-wrap">${aiResult}</div>`:""}
      </div>`;
    setTimeout(()=>{
      document.getElementById("btnAI").onclick=async()=>{
        if(cycleRecs.length===0){aiResult="この月のデータがありません。";render();return;}
        document.getElementById("btnAI").disabled=true;
        document.getElementById("btnAI").textContent="分析中...";
        const fixedSum=FIXED_TAGS.map(t=>`  ${t.label}: ${yen(byTag[t.id])}`).join("\n");
        const dailySum=DAILY_TAGS.map(t=>`  ${t.label}: ${yen(byTag[t.id])}`).join("\n");
        const weekSum=weeks.map((w,i)=>`  ${w.label}: 予算${yen(cycleBudget[`w${i}`]||0)} / 実績${yen(weekActuals[i])}`).join("\n");
        const prompt=`給与月: ${cycleKey}（${start}〜${end}）\n収入: ${yen(cycleIncome)} / 支出: ${yen(cycleExpense)} / 収支: ${yen(cycleBalance)}\nSMBC借金残高（元本）: ${yen(debtRemaining)}（年利${(smbcDebt.rate*100).toFixed(0)}%）\n今月の利息: ${yen(monthInterestTotal)} / 元本返済: ${yen(monthPrincipalTotal)}\n${completionMonths?`完済予測: あと約${completionMonths}ヶ月`:""}\n\n固定支出:\n${fixedSum}\n\n日常支出:\n${dailySum}\n\n週次予算vs実績:\n${weekSum}\n\n①収支の総評、②借金返済ペースと利息負担の評価、③週次予算の達成状況、④日常支出の傾向と改善アドバイス3点`;
        try{
          aiResult=await callClaude("家計管理の専門家として、借金返済中のユーザーに率直で建設的なアドバイスをしてください。利息負担と元本返済の違いも含めて評価してください。",prompt);
        }catch(err){aiResult="エラーが発生しました: "+err.message;}
        render();
      };
    },0);
  }

  else if(currentTab==="settings"){
    const nw=calcNetWorth();
    app.innerHTML=`
      <div class="card" style="padding:17px;display:flex;flex-direction:column;gap:16px">
        <div>
          <div class="section-title">🏦 口座残高の設定</div>
          <p style="font-size:.72rem;color:#9a8e82;margin-bottom:10px">手元資金の現在残高を入力してください。純資産計算に使われます。</p>
          ${accounts.map((a,i)=>`
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
              <span style="font-size:.78rem;min-width:72px;color:var(--ink)">${a.label}</span>
              <input type="number" class="acc-input" data-i="${i}" value="${a.balance}" min="0" style="flex:1"/>
              <span style="font-size:.72rem;color:#9a8e82">円</span>
            </div>`).join("")}
          <button class="pbtn" id="btnSaveAccounts" style="margin-top:4px;width:100%">口座残高を保存</button>
        </div>
        <hr style="border:none;border-top:1px solid var(--cream)"/>
        <div>
          <div class="section-title">💳 負債残高の設定</div>
          <p style="font-size:.72rem;color:#9a8e82;margin-bottom:10px">各借金の現在残高・利率・月返済額を設定してください。</p>
          ${debts.map((d,i)=>`
            <div style="background:var(--cream);border-radius:8px;padding:10px 12px;margin-bottom:8px">
              <div style="font-size:.8rem;font-weight:600;color:${d.color||"var(--red)"};margin-bottom:8px">${d.label}</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
                <div>
                  <div class="lbl">残高（円）</div>
                  <input type="number" class="debt-bal-input" data-i="${i}" value="${d.balance}" min="0"/>
                </div>
                <div>
                  <div class="lbl">年利（%）</div>
                  <input type="number" class="debt-rate-input" data-i="${i}" value="${(d.rate*100).toFixed(1)}" min="0" max="100" step="0.1"/>
                </div>
                <div>
                  <div class="lbl">月返済額（円）</div>
                  <input type="number" class="debt-pay-input" data-i="${i}" value="${d.monthlyPay}" min="0"/>
                </div>
              </div>
            </div>`).join("")}
          <button class="pbtn" id="btnSaveDebts" style="width:100%">負債情報を保存</button>
        </div>
        <hr style="border:none;border-top:1px solid var(--cream)"/>
        <div>
          <div class="section-title">📊 現在の純資産サマリー</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">
            <div class="card" style="padding:10px;text-align:center">
              <div class="lbl" style="text-align:center">総資産</div>
              <div style="font-weight:700;color:var(--blue)">${yen(nw.totalAssets)}</div>
            </div>
            <div class="card" style="padding:10px;text-align:center">
              <div class="lbl" style="text-align:center">総負債</div>
              <div style="font-weight:700;color:var(--red)">${yen(nw.totalDebt)}</div>
            </div>
          </div>
          <div class="card" style="padding:10px;text-align:center;margin-top:7px;border-left:4px solid ${nw.netWorth>=0?"var(--green)":"var(--red)"}">
            <div class="lbl" style="text-align:center">純資産</div>
            <div style="font-size:1.3rem;font-weight:700;color:${nw.netWorth>=0?"var(--green)":"var(--red)"}">${nw.netWorth>=0?"":""} ${yen(nw.netWorth)}</div>
            ${nw.netWorth<0?`<div style="font-size:.65rem;color:#9a8e82;margin-top:3px">債務超過</div>`:""}
          </div>
        </div>
      </div>`;
    setTimeout(()=>{
      document.getElementById("btnSaveAccounts").onclick=async()=>{
        document.querySelectorAll(".acc-input").forEach(inp=>{
          const i=parseInt(inp.dataset.i);
          accounts[i].balance=parseInt(inp.value)||0;
        });
        await saveMeta(); showFlash("口座残高を保存しました"); render();
      };
      document.getElementById("btnSaveDebts").onclick=async()=>{
        document.querySelectorAll(".debt-bal-input").forEach(inp=>{
          const i=parseInt(inp.dataset.i);
          debts[i].balance=parseInt(inp.value)||0;
        });
        document.querySelectorAll(".debt-rate-input").forEach(inp=>{
          const i=parseInt(inp.dataset.i);
          debts[i].rate=parseFloat(inp.value)/100||0;
        });
        document.querySelectorAll(".debt-pay-input").forEach(inp=>{
          const i=parseInt(inp.dataset.i);
          debts[i].monthlyPay=parseInt(inp.value)||0;
        });
        await saveMeta(); showFlash("負債情報を保存しました"); render();
      };
    },0);
  }

  else if(currentTab==="guide"){
    app.innerHTML=`
      <div class="card" style="padding:17px;display:flex;flex-direction:column;gap:16px">
        <div>
          <div class="section-title">📅 給与サイクルのルール</div>
          <p style="font-size:.78rem;line-height:1.8;color:#4a4035">給与日は毎月<strong>20日</strong>。「4月分」は<strong>3月20日〜4月19日</strong>として管理します。</p>
        </div>
        <div>
          <div class="section-title">💳 借金返済の計算方法</div>
          <p style="font-size:.78rem;line-height:1.8;color:#4a4035">年利<strong>10%</strong>（月利約0.833%）。返済額を入力すると自動で利息分と元本返済分に分解されます。<strong>元本残高 × 月利 = 利息</strong>、残りが元本返済分として残高から引かれます。</p>
        </div>
        <div>
          <div class="section-title">💳 支払い手段別の入力ルール</div>
          <table class="guide-table">
            <thead><tr><th>手段</th><th>方法</th><th>頻度</th></tr></thead>
            <tbody>
              <tr><td>💬 PayPay</td><td>明細スクショ → OCR読込</td><td>週1回</td></tr>
              <tr><td>🏦 デビットカード</td><td>銀行明細スクショ → OCR読込</td><td>週1回</td></tr>
              <tr><td>💳 クレジットカード</td><td>明細スクショ → OCR読込</td><td>週1回</td></tr>
              <tr><td>🚃 Suica</td><td>Suica明細 → OCR読込</td><td>週1回</td></tr>
              <tr><td>🏦 給与入金</td><td>銀行口座（給与入金）→ OCR読込</td><td>月1回</td></tr>
              <tr><td>💴 現金</td><td><strong>使った瞬間に手動入力</strong></td><td>その都度</td></tr>
            </tbody>
          </table>
        </div>
        <div>
          <div class="section-title">🚫 二重計上を防ぐルール</div>
          <table class="guide-table">
            <thead><tr><th>取引</th><th>扱い</th></tr></thead>
            <tbody>
              <tr><td>銀行→PayPayチャージ</td><td style="color:var(--red);font-weight:600">読み込まない（資金移動）</td></tr>
              <tr><td>銀行/クレカ→Suicaチャージ</td><td style="color:var(--red);font-weight:600">読み込まない（資金移動）</td></tr>
              <tr><td>ATM現金引き出し</td><td style="color:var(--red);font-weight:600">読み込まない（現金で別途入力）</td></tr>
              <tr><td>クレカの銀行引き落とし</td><td style="color:var(--red);font-weight:600">読み込まない（クレカ明細側で入力済）</td></tr>
              <tr><td>給与振込</td><td style="color:var(--green);font-weight:600">OCR読込で記録</td></tr>
            </tbody>
          </table>
        </div>
        <div style="background:#fefde7;border:1px solid #f0d060;border-radius:8px;padding:11px 13px;font-size:.76rem;line-height:1.8;color:#5a4a00">
          <strong>💡 週1ルーティン（目安5分）</strong><br>
          ① PayPay・デビット・クレカ・Suicaの明細スクショを撮る<br>
          ② 📷 明細読込タブで1枚ずつ読み込む<br>
          ③ 週次予算タブで進捗を確認<br>
          ④ ズレがあればAI分析で原因チェック<br>
          ⑤ 給与日翌日に給与入金をOCR読込
        </div>
      </div>`;
  }
}
</script>
</body>
</html>
